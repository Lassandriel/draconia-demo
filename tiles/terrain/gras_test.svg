<svg xmlns="http://www.w3.org/2000/svg" width="144" height="131" viewBox="0 0 144 131">
  <!-- Testtile fuer den Ueberhang: Hexform 96x83 mittig, ringsum 24 px Rand.
       Die Halme oben und die Wurzeln unten liegen AUSSERHALB der Hexform und
       werden nur sichtbar, wo kein Nachbar sitzt. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab055"/>
      <stop offset="1" stop-color="#4a6b3a"/>
    </linearGradient>
  </defs>

  <!-- Wurzeln nach unten, in den Rand hinein -->
  <g fill="#5c4630">
    <path d="M60 104 q-3 12 -6 21 q5 -8 9 -19 z"/>
    <path d="M78 104 q2 14 7 23 q-2 -12 -3 -23 z"/>
    <path d="M94 102 q6 9 11 15 q-4 -9 -8 -16 z"/>
  </g>

  <!-- Die Hexform selbst -->
  <polygon points="120,65.5 96,107.1 48,107.1 24,65.5 48,23.9 96,23.9" fill="url(#g)"/>

  <!-- Halme nach oben, in den Rand hinein -->
  <g fill="#8cc466">
    <path d="M52 26 q-4 -14 -9 -20 q7 6 12 20 z"/>
    <path d="M62 24 q-1 -17 2 -24 q2 10 2 24 z"/>
    <path d="M74 24 q3 -15 9 -21 q-3 10 -5 21 z"/>
    <path d="M86 25 q6 -11 13 -15 q-6 7 -9 15 z"/>
    <path d="M96 27 q8 -7 15 -8 q-8 4 -12 9 z"/>
    <path d="M44 30 q-9 -6 -16 -7 q8 4 13 8 z"/>
  </g>

  <!-- Ein paar Buschel auf der Flaeche, damit man das Tile erkennt -->
  <g fill="#8cc466" fill-opacity=".55">
    <circle cx="60" cy="48" r="7"/>
    <circle cx="86" cy="58" r="6"/>
    <circle cx="70" cy="76" r="8"/>
  </g>
</svg>
