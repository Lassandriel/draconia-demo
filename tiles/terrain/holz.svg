<svg xmlns="http://www.w3.org/2000/svg" width="96" height="83" viewBox="0 0 96 83.14">
  <!-- Solid wood: horizontal planks with grain (Jean, 03.11.2026: the old spots
       looked like dirt). Lighter and warmer than bg/holzwand, so a wooden block
       stands out from a wooden wall behind it. The contour rendering cuts out
       x 24..72, y 9.07..74.07 and tiles it mirrored - so the plank seams lie
       symmetric around the middle (y 41.57). -->
  <defs>
    <clipPath id="c_holz"><polygon points="96.00,41.57 72.00,83.14 24.00,83.14 0.00,41.57 24.00,0.00 72.00,0.00"/></clipPath>
  </defs>
  <g clip-path="url(#c_holz)">
    <rect width="96" height="83.14" fill="#946a45"/>
    <!-- planks, alternating shade -->
    <rect x="0" y="0" width="96" height="17.57" fill="#8c6340"/>
    <rect x="0" y="33.57" width="96" height="16" fill="#8c6340"/>
    <rect x="0" y="65.57" width="96" height="17.57" fill="#8c6340"/>
    <!-- grain: thin lines along the planks -->
    <g fill="none" stroke-linecap="round">
      <path d="M0 12 Q24 10.5 48 12 T96 12" stroke="#6f4b2e" stroke-width="1" opacity=".55"/>
      <path d="M0 23 Q20 24.5 44 23 T96 23.5" stroke="#b08156" stroke-width="1" opacity=".6"/>
      <path d="M0 28.5 Q30 27 60 28.5 T96 28" stroke="#6f4b2e" stroke-width="1" opacity=".5"/>
      <path d="M0 38 Q26 39.5 50 38 T96 38" stroke="#6f4b2e" stroke-width="1" opacity=".55"/>
      <path d="M0 45 Q22 43.5 46 45 T96 45" stroke="#6f4b2e" stroke-width="1" opacity=".55"/>
      <path d="M0 54.5 Q30 56 60 54.5 T96 55" stroke="#6f4b2e" stroke-width="1" opacity=".5"/>
      <path d="M0 60 Q20 58.5 44 60 T96 59.5" stroke="#b08156" stroke-width="1" opacity=".6"/>
      <path d="M0 71 Q24 72.5 48 71 T96 71" stroke="#6f4b2e" stroke-width="1" opacity=".55"/>
    </g>
    <!-- no knots: the mirrored tiling turns one knot into pairs like eyes -->
    <!-- seams between the planks -->
    <g fill="#4a3121">
      <rect x="0" y="16.82" width="96" height="1.5"/>
      <rect x="0" y="32.82" width="96" height="1.5"/>
      <rect x="0" y="48.82" width="96" height="1.5"/>
      <rect x="0" y="64.82" width="96" height="1.5"/>
      <!-- butt joints, staggered -->
      <rect x="40" y="17.57" width="1.5" height="16"/>
      <rect x="54" y="49.57" width="1.5" height="16"/>
    </g>
    <!-- light top edge of each plank -->
    <g fill="#b48a5e" opacity=".55">
      <rect x="0" y="18.32" width="96" height="1"/>
      <rect x="0" y="34.32" width="96" height="1"/>
      <rect x="0" y="50.32" width="96" height="1"/>
      <rect x="0" y="66.32" width="96" height="1"/>
    </g>
  </g>
</svg>
