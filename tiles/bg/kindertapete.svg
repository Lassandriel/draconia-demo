<svg xmlns="http://www.w3.org/2000/svg" width="96" height="83" viewBox="0 0 96 83.14">
  <!-- Kindertapete fuer Ryugas Spielzimmer (Jean: verspielter, kindlich).
       Mintgruen, ein heller Streifen, Sonne, Woelkchen, Sterne. Von Hand.
       Vorher himmelblau #93bcdc - Zephs Fluegelhaut verschwand darauf (gemessen
       dE 5), wie in seinem Zimmer (Jean, 20.10.2026); jetzt dE 30.
       Achtung: Das Spiel nimmt nur die Mitte (etwa x 24..72, y 9..74) und
       kachelt sie 2x2 gespiegelt (terrain.js, texturAus) - darum liegt alles
       Wichtige dort, mit Abstand zum Rand, und die Wolken sind oben und unten
       gleich, damit sie gespiegelt nicht auf dem Kopf stehen. -->
  <rect width="96" height="83.14" fill="#7fb393"/>
  <rect x="40" y="0" width="16" height="83.14" fill="#95c4a8"/>
  <!-- Sonne -->
  <g fill="#f2c94c" stroke="#f2c94c" stroke-width="1.6" stroke-linecap="round">
    <circle cx="48" cy="26" r="4.2" stroke="none"/>
    <line x1="48" y1="18.5" x2="48" y2="16.5"/><line x1="48" y1="33.5" x2="48" y2="35.5"/>
    <line x1="40.5" y1="26" x2="38.5" y2="26"/><line x1="55.5" y1="26" x2="57.5" y2="26"/>
    <line x1="42.7" y1="20.7" x2="41.3" y2="19.3"/><line x1="53.3" y1="31.3" x2="54.7" y2="32.7"/>
    <line x1="53.3" y1="20.7" x2="54.7" y2="19.3"/><line x1="42.7" y1="31.3" x2="41.3" y2="32.7"/>
  </g>
  <!-- Woelkchen: drei gleich hohe Kreise, oben und unten gleich -->
  <g fill="#f4f8fc" opacity=".9">
    <circle cx="43" cy="58" r="3.4"/><circle cx="48" cy="58" r="4.4"/><circle cx="53" cy="58" r="3.4"/>
  </g>
  <!-- Sterne -->
  <g fill="#f7dc8a">
    <path transform="translate(32 42)" d="M0 -4 L1.2 -1.2 L4 -1.2 L1.7 0.6 L2.5 3.4 L0 1.7 L-2.5 3.4 L-1.7 0.6 L-4 -1.2 L-1.2 -1.2 Z"/>
    <path transform="translate(64 42)" d="M0 -4 L1.2 -1.2 L4 -1.2 L1.7 0.6 L2.5 3.4 L0 1.7 L-2.5 3.4 L-1.7 0.6 L-4 -1.2 L-1.2 -1.2 Z"/>
  </g>
</svg>
